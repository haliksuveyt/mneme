name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should Mneme do? Mention a command or setting if you have one in mind.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client this affects
      multiple: true
      options: [Claude Code, Codex, Antigravity, Hermes, OpenCode, OMP, MCP client, All]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: markdown
    attributes:
      value: The Mneme engine uses only the Python standard library, so proposals that need a third-party package cannot be accepted.
